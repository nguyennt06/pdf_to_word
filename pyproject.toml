[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "editable-pdf-to-word"
version = "0.1.0"
description = "Convert text-based PDF files to editable DOCX documents"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "PyMuPDF==1.28.0",
    "pdf2docx==0.5.13",
    "python-docx==1.2.0",
    "Pillow==12.3.0",
    "fonttools==4.63.0",
]

[project.scripts]
pdf-to-word = "main:main"

[tool.setuptools]
py-modules = ["main"]
